version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: r2l_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: r2l_user
      POSTGRES_PASSWORD: r2l_password
      POSTGRES_DB: r2l_chatbot
    ports:
      - "5432:5432"
    volumes:
      - r2l_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2l_user -d r2l_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: r2l_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - r2l_qdrant_data:/qdrant/storage

  api:
    build: .
    container_name: r2l_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

volumes:
  r2l_pg_data:
  r2l_qdrant_data:
